[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specialagent"
version = "0.30.0"
readme = "readme.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
addopts = "--doctest-modules -v"
doctest_optionflags = 'ELLIPSIS'

[project.scripts]
specialagent = "specialagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["specialagent"]
